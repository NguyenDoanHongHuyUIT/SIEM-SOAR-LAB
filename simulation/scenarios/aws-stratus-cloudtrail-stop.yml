id: aws-stratus-cloudtrail-stop
title: AWS technique - stop a CloudTrail trail (Stratus Red Team), detected by GuardDuty
kind: stratus
malicious: true
stratus_technique: aws.defense-evasion.cloudtrail-stop
detonate_as: victim       # the simulation-zone IAM user (lab-victim): the finding names its key, so iam_key_disable runs
documented_detection:     # Stratus' own page names the GuardDuty finding this technique raises
  finding_type: 'Stealth:IAMUser/CloudTrailLoggingDisabled'
  url: https://stratus-red-team.cloud/attack-techniques/AWS/aws.defense-evasion.cloudtrail-stop/
expect:
  - {source: guardduty, rule_id: 'Stealth:IAMUser/CloudTrailLoggingDisabled', case: true}
settle_seconds: 1800      # lab session 2: GuardDuty raised a CloudTrailLoggingDisabled finding 18 min after the API call
notes: >-
  Stratus warms up (creates its own trail) with the operator's credentials and detonates with lab-victim's key.
  Its cleanup deletes the trail with the operator's key, which GuardDuty also reports (same finding type, the
  operator as actor): that case is outside the containment scope (notify only) and, the run's target being the
  victim key, is not attributed to this run.
