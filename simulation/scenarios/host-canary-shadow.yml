id: host-canary-shadow
title: Shadow rule must NOT create a case (lifecycle semantics)
kind: ssm_shell
target: sensor
malicious: false          # benign touch of the canary dir: any case here would be a lifecycle violation
techniques: []
commands:
  - 'echo "run_id={run_id}" >> /srv/lab/canary.txt'
cleanup: []
expect:
  - {source: wazuh, rule_id: "100101", case: false}
settle_seconds: 90
