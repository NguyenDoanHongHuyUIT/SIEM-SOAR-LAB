id: host-benign-admin-maintenance
title: Benign - routine maintenance that touches persistence locations (package with a cron job, a profile.d setting)
kind: ssm_shell
target: sensor
malicious: false
commands:
  # Ubuntu's sysstat ships /etc/cron.d/sysstat (packages.ubuntu.com, jammy filelist): the cron location rule 100140
  # watches, written by a package instead of an attacker
  - 'apt-get -o DPkg::Lock::Timeout=120 install -y sysstat'
  - 'test -e /etc/cron.d/sysstat'
  # a common shell setting an administrator drops into /etc/profile.d (location of rule 100142)
  - 'echo "export HISTTIMEFORMAT=\"%F %T \"" > /etc/profile.d/siemsoar-histtime-{short}.sh'
cleanup:
  - 'apt-get -o DPkg::Lock::Timeout=120 purge -y sysstat || true'
  - 'rm -f /etc/profile.d/siemsoar-histtime-{short}.sh'
expect:                   # measured on the lab 2026-10-20 (who-data); declared false positives are still counted as FP
  # the sysstat cron file is written by /usr/bin/dpkg under /usr/bin/apt-get: the who-data exception, 100140 must not fire
  - {source: wazuh, rule_id: "100146", case: false}
  # the profile.d file is written by a shell (/usr/bin/dash), the same writer as T1546.004
  - {source: wazuh, rule_id: "100142", case: false, false_positive: true}
  # apt runs dpkg-preconfigure (perl), which reads /etc/shadow: the accepted false positive of 100145
  - {source: wazuh, rule_id: "100145", case: false, false_positive: true, optional: true}
settle_seconds: 120
notes: >
  False-positive measurement for the persistence rules written from the Atomic observations (100140-100142): their
  locations are also where packages and administrators write. Authored benign activity, not a public procedure.
