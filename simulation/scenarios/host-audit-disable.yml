id: host-audit-disable
title: Defense impairment - turn kernel auditing off with auditctl (Atomic Red Team T1685.004 test 2)
kind: atomic
target: sensor
malicious: true
atomic:
  technique: T1685.004
  test_guid: 7906f0a6-b527-46ee-9026-6e81a9184e08
  ref: 388942adbd9641f4dfdcf079d7efe9a75ec0ac43
  timeout: 120
verify:
  - 'auditctl -s | grep -q "^enabled 0"'
cleanup:
  # ART's cleanup is `auditctl -e 1`; also put the project's rules back and make sure the who-data engine kept its
  # audit rules (2026-10-20: who-data silently fell back to real-time when auditing was off at an agent restart)
  - 'auditctl -e 1'
  - 'augenrules --load'
  - 'sleep 10; auditctl -l | grep -q wazuh_fim || systemctl restart wazuh-agent'
  - 'auditctl -s | grep -q "^enabled 1"'
expect: []                # observation run: what the SIEM records when auditing is turned off (official 80705, lab 2026-10-20)
settle_seconds: 120
notes: >
  Observation of T1685.004 before any rule: on 2026-10-20 a benign journald restart turned auditing off on two hosts
  and only the official rule 80705 (level 3) recorded it. A SIEMSOAR rule is written from this run's events.
