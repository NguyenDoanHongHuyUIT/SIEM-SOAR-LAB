id: host-audit-disable
title: Defense impairment - turn kernel auditing off with auditctl (Atomic Red Team T1685.004 test 2)
kind: atomic
target: sensor
malicious: true
atomic:
  technique: T1685.004
  test_guid: 7906f0a6-b527-46ee-9026-6e81a9184e08
  ref: 388942adbd9641f4dfdcf079d7efe9a75ec0ac43
  timeout: 120
verify:
  - 'auditctl -s | grep -q "^enabled 0"'
cleanup:
  # ART's cleanup is `auditctl -e 1`; also put the project's rules back and check the FIM daemon survived
  # reload the rules with the agent stopped: a reload under a running syscheckd with who-data on can segfault it
  # (wazuh/wazuh#40844; seen in this scenario's first run, 2026-10-30 03:07:25; FIM blind until the agent restart
  # at 03:10:12)
  - 'systemctl stop wazuh-agent'
  - 'auditctl -e 1'
  - 'augenrules --load'
  - 'systemctl start wazuh-agent'
  - 'for i in $(seq 1 30); do /var/ossec/bin/wazuh-control status | grep -q "wazuh-syscheckd is running" && auditctl -l | grep -q wazuh_fim && break; sleep 2; done'
  # the cleanup is one script whose status is its last line: every check goes there
  - '/var/ossec/bin/wazuh-control status | grep -q "wazuh-syscheckd is running" && auditctl -l | grep -q wazuh_fim && auditctl -s | grep -q "^enabled 1"'
expect:
  - {source: wazuh, rule_id: "100147", case: false}   # shadow; written from this scenario's lab events (2026-10-30)
settle_seconds: 120
notes: >
  Observation of T1685.004 before any rule: on 2026-10-20 a benign journald restart turned auditing off on two hosts
  and only the official rule 80705 (level 3) recorded it. A SIEMSOAR rule is written from this run's events.
