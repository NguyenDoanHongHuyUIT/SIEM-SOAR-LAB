id: host-history-truncate
title: Stealth - truncate bash history (Atomic Red Team T1070.003 test 5)
kind: atomic
target: sensor
malicious: true
atomic:
  technique: T1070.003
  test_guid: 47966a1d-df4f-4078-af65-db6d9aa20739
  ref: 388942adbd9641f4dfdcf079d7efe9a75ec0ac43
  timeout: 120
prepare:
  - 'if [ -e /root/.bash_history ]; then cp -a /root/.bash_history /tmp/siemsoar_hist_{short}; fi'
  - 'echo siemsoar-{short} >> /root/.bash_history'
verify:
  - 'test ! -s /root/.bash_history'
cleanup:
  - 'if [ -e /tmp/siemsoar_hist_{short} ]; then mv /tmp/siemsoar_hist_{short} /root/.bash_history; else rm -f /root/.bash_history; fi'
expect:
  - {source: wazuh, rule_id: "100143", case: false}   # shadow; written from this scenario's lab events (2026-10-19)
settle_seconds: 120
