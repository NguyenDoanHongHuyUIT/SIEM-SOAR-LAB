id: host-benign-custom-service
title: Benign - an administrator adds a custom systemd service in /etc/systemd/system
kind: ssm_shell
target: sensor
malicious: false
commands:
  # the documented place for local units (systemd.unit(5): /etc/systemd/system holds "System units created by the
  # administrator"); the same directory as rule 100141's Atomic T1543.002 evidence
  - 'printf "[Unit]\nDescription=SIEMSOAR benign {short}\n[Service]\nType=oneshot\nExecStart=/bin/true\n" > /etc/systemd/system/siemsoar-benign-{short}.service'
  - 'systemctl daemon-reload'
  - 'systemctl start siemsoar-benign-{short}.service'
cleanup:
  - 'rm -f /etc/systemd/system/siemsoar-benign-{short}.service'
  - 'systemctl daemon-reload'
expect:                   # measured on the lab 2026-10-20; a declared false positive is still counted as FP
  # the unit file is written by a shell (/usr/bin/dash), as the Atomic T1543.002 unit: who-data cannot tell them apart
  - {source: wazuh, rule_id: "100141", case: false, false_positive: true}
settle_seconds: 120
notes: False-positive measurement for 100141. Authored benign activity, not a public procedure.
