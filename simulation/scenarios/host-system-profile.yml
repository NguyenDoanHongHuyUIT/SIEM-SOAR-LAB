id: host-system-profile
title: Persistence - append to the system shell profile (Atomic Red Team T1546.004 test 4)
kind: atomic
target: sensor
malicious: true
atomic:
  technique: T1546.004
  test_guid: 694b3cc8-6a78-4d35-9e74-0123d009e94b
  ref: 388942adbd9641f4dfdcf079d7efe9a75ec0ac43
  timeout: 120
prepare:                  # backup: the upstream cleanup removes a string the test never wrote (ART 388942ad)
  - 'cp -p /etc/profile /var/tmp/profile.siemsoar.bak && sha256sum /etc/profile > /tmp/siemsoar_profile_{short}'
verify:
  - '! sha256sum --status -c /tmp/siemsoar_profile_{short}'
cleanup:
  - 'cp -p /var/tmp/profile.siemsoar.bak /etc/profile && rm -f /var/tmp/profile.siemsoar.bak /tmp/siemsoar_profile_{short}'
expect:
  - {source: wazuh, rule_id: "100142", case: false}   # shadow; written from this scenario's lab events (2026-10-19)
settle_seconds: 120
