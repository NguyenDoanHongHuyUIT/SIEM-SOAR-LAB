id: host-benign-service-account
title: Benign - an administrator creates a system account for a new service (false-positive measurement)
kind: ssm_shell
target: sensor
malicious: false
commands:
  # what package post-install scripts and administrators do every day; on the host it is the same useradd as T1136.001
  - 'useradd --system --no-create-home --shell /usr/sbin/nologin siemsoar_svc_{short}'
cleanup:
  - 'userdel siemsoar_svc_{short} || true'
expect:                   # known false positives: they fire on intent-free account creation (counted as FP)
  - {source: wazuh, rule_id: "100110", case: true, false_positive: true}
  - {source: wazuh, rule_id: "100100", case: false, false_positive: true}
  - {source: wazuh, rule_id: "100102", case: false, false_positive: true}   # useradd also writes /etc/shadow (lab 2026-10-17)
settle_seconds: 120
notes: >
  Shows the limit of rules 100100/100110: they see account creation, not intent. Every case or SIEM alert in this run's
  window on the target is counted as a false positive by the evaluation.
