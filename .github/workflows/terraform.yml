name: terraform
on:
  pull_request:
    paths: ["infra/**", "statemachine/**", "src/lambdas/**", "wazuh/**", "suricata/**", "scripts/**"]
  push:
    branches: [main]
    paths: ["infra/**", "statemachine/**", "src/lambdas/**", "wazuh/**", "suricata/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      lab_enabled:
        description: "On-demand plane (Wazuh + lab EC2). keep = whatever the current state has"
        type: choice
        options: [keep, "true", "false"]
        default: keep

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-lab # never run two plans/applies against the same state
  cancel-in-progress: false

env:
  TF_DIR: infra/envs/lab
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }} # secret: Actions logs of a public repo are public
  TF_VAR_slack_channel: ${{ vars.SLACK_CHANNEL }}
  TF_VAR_dry_run: ${{ vars.DRY_RUN || 'true' }}
  TF_VAR_enable_fault_injection: ${{ vars.ENABLE_FAULT_INJECTION || 'false' }}

jobs:
  plan:
    # no AWS role yet (before infra/bootstrap): skip instead of failing every PR
    if: github.event_name == 'pull_request' && vars.PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tools.gen_asl --check
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=$TF_DIR init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" -backend-config="region=$AWS_REGION"
      - run: terraform -chdir=$TF_DIR validate
      - name: Plan (lab plane keeps its current on/off state)
        id: plan
        run: |
          # `output lab` fails while the lab plane has never been created: that means false (an empty value would not)
          LAB=$( (terraform -chdir=$TF_DIR output -json lab 2>/dev/null || echo null) | jq -r 'if . == null then "false" else "true" end')
          terraform -chdir=$TF_DIR plan -input=false -no-color -var "lab_enabled=$LAB" | tee plan.txt
      - name: Summarise plan
        if: always()
        run: |
          {
            echo '### terraform plan'
            echo '```'
            tail -n 60 plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: lab # protection rule = manual approval before anything is applied
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: terraform -chdir=$TF_DIR init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" -backend-config="region=$AWS_REGION"
      - name: Apply
        env:
          LAB_INPUT: ${{ github.event.inputs.lab_enabled || 'keep' }}
        run: |
          INPUT="$LAB_INPUT"
          if [ "$INPUT" = "keep" ]; then
            INPUT=$( (terraform -chdir=$TF_DIR output -json lab 2>/dev/null || echo null) | jq -r 'if . == null then "false" else "true" end')
          fi
          terraform -chdir=$TF_DIR apply -input=false -auto-approve -var "lab_enabled=$INPUT"
