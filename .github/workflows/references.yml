name: references
# Every reference cited by a rule or by policy.toml must still resolve. Scheduled and non-blocking for pull requests:
# a third-party outage must not fail a PR, but a dead link must be noticed.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tools.refcheck
