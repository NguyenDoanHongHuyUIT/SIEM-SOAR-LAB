name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: State machine definition is in sync with its generator
        run: python -m tools.gen_asl --check
      - run: pytest

  detection-as-code:
    name: rules (lint, tests, lifecycle gate, real Suricata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lifecycle gate compares with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install pyyaml
      - name: Lint (metadata, ids, MITRE, lifecycle groups, coverage of every rule)
        run: python -m tools.rulesctl lint
      - name: Positive/negative tests for every rule
        run: python -m tools.rulesctl test
      - name: Lifecycle gate (new rules start in shadow; only legal state moves)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          REVERT=""
          case "$TITLE" in Revert*) REVERT="--allow-revert" ;; esac
          python -m tools.rulesctl lifecycle --base "origin/${{ github.base_ref }}" $REVERT
      - name: Build release (also proves the generated Wazuh/Suricata files parse)
        run: python -m tools.rulesctl build --out dist --sha "${GITHUB_SHA}"
      - name: Install Suricata for the authoritative syntax + pcap replay test
        run: |
          sudo add-apt-repository -y ppa:oisf/suricata-stable
          sudo apt-get update -y
          sudo apt-get install -y suricata
      - name: suricata -T and pcap replay (true positives AND benign traffic)
        run: python -m tools.suricata_pcap_test --rules "dist/${GITHUB_SHA}/suricata/siemsoar.rules"
      - name: Coverage report
        run: python -m tools.rulesctl coverage | tee "$GITHUB_STEP_SUMMARY"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck bootstrap and deploy scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning wazuh/bootstrap_manager.sh suricata/bootstrap_sensor.sh scripts/deploy_rules.sh \
            wazuh/integrations/custom-eventbridge

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive infra
      - name: validate every root module (no backend, no credentials)
        run: |
          for dir in infra/bootstrap infra/envs/lab; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: terraform test (mocked AWS provider: the full configuration must plan, with and without the lab plane)
        run: |
          terraform -chdir=infra/envs/lab init -backend=false -input=false
          terraform -chdir=infra/envs/lab test
      - name: Security scan (Trivy config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "0" # report-only: the lab intentionally uses AdministratorAccess for apply (documented limit)
