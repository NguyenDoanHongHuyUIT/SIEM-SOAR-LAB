id: wazuh-100145
engine: wazuh
rule_id: 100145
name: Credential store read by an unexpected program
state: shadow
response: ec2_isolate
mitre: [T1003.008]
wraps: [80784]
references:
  - https://attack.mitre.org/techniques/T1003/008/
  - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1003.008/T1003.008.md
  - https://documentation.wazuh.com/current/user-manual/capabilities/system-calls-monitoring/use-cases/monitoring-file-and-directory-access.html
  - https://github.com/wazuh/wazuh/blob/v4.14.8/ruleset/rules/0365-auditd_rules.xml
tactic: Credential Access   # ATT&CK v20 kill_chain_phases of T1003.008
owner: nguyen-doan-hong-huy
created: 2026-10-20
data_source: Linux audit (read watch on /etc/shadow, /etc/gshadow) via Wazuh rule 80784
description: >
  /etc/shadow or /etc/gshadow read by a program other than the ones observed reading it in normal operation on
  the three lab hosts since auditd was enabled (2026-10-19): wazuh-modulesd, wazuh-syscheckd, sudo, cron, passwd.
  Observed attack: cat /etc/shadow (Atomic T1003.008 #1).
expected_fp: >
  Authentication programs not seen on the lab yet (e.g. sshd or unix_chkpwd during password logins): to be
  measured in shadow and added to the list from recorded events only.
tests:
  - name: cat /etc/shadow (Atomic T1003.008 #1, recorded on the lab)
    expect: match
    log_format: audit
    location: /var/log/audit/audit.log
    log: "type=SYSCALL msg=audit(1792430267.424:2276): arch=c000003e syscall=257 success=yes exit=3 a0=ffffff9c a1=7ffd36d95ee8 a2=0 a3=0 items=1 ppid=2236 pid=2237 auid=4294967295 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"cat\" exe=\"/usr/bin/cat\" subj=snap.amazon-ssm-agent.amazon-ssm-agent key=\"audit-wazuh-r\"\u001dARCH=x86_64 SYSCALL=openat AUID=\"unset\" UID=\"root\" GID=\"root\" EUID=\"root\" SUID=\"root\" FSUID=\"root\" EGID=\"root\" SGID=\"root\" FSGID=\"root\" type=CWD msg=audit(1792430267.424:2276): cwd=\"/var/snap/amazon-ssm-agent/13349\" type=PATH msg=audit(1792430267.424:2276): item=0 name=\"/etc/shadow\" inode=3058 dev=103:01 mode=0100640 ouid=0 ogid=42 rdev=00:00 nametype=NORMAL cap_fp=0 cap_fi=0 cap_fe=0 cap_fver=0 cap_frootid=0\u001dOUID=\"root\" OGID=\"shadow\" type=PROCTITLE msg=audit(1792430267.424:2276): proctitle=636174002F6574632F736861646F77"
  - name: sudo reading /etc/shadow (recorded on the lab)
    expect: no_match
    log_format: audit
    location: /var/log/audit/audit.log
    log: "type=SYSCALL msg=audit(1792430267.420:2270): arch=c000003e syscall=257 success=yes exit=6 a0=ffffff9c a1=74f3e95dc2dd a2=80000 a3=0 items=1 ppid=2235 pid=2236 auid=4294967295 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"sudo\" exe=\"/usr/bin/sudo\" subj=snap.amazon-ssm-agent.amazon-ssm-agent key=\"audit-wazuh-r\"\u001dARCH=x86_64 SYSCALL=openat AUID=\"unset\" UID=\"root\" GID=\"root\" EUID=\"root\" SUID=\"root\" FSUID=\"root\" EGID=\"root\" SGID=\"root\" FSGID=\"root\" type=CWD msg=audit(1792430267.420:2270): cwd=\"/var/snap/amazon-ssm-agent/13349\" type=PATH msg=audit(1792430267.420:2270): item=0 name=\"/etc/shadow\" inode=3058 dev=103:01 mode=0100640 ouid=0 ogid=42 rdev=00:00 nametype=NORMAL cap_fp=0 cap_fi=0 cap_fe=0 cap_fver=0 cap_frootid=0\u001dOUID=\"root\" OGID=\"shadow\" type=PROCTITLE msg=audit(1792430267.420:2270): proctitle=7375646F00636174002F6574632F736861646F77"
  - name: cron reading /etc/shadow (recorded on the lab)
    expect: no_match
    log_format: audit
    location: /var/log/audit/audit.log
    log: "type=SYSCALL msg=audit(1792408621.739:1690): arch=c000003e syscall=257 success=yes exit=7 a0=ffffff9c a1=788779ddc2dd a2=80000 a3=0 items=1 ppid=383 pid=3749 auid=4294967295 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"cron\" exe=\"/usr/sbin/cron\" subj=unconfined key=\"audit-wazuh-r\"\u001dARCH=x86_64 SYSCALL=openat AUID=\"unset\" UID=\"root\" GID=\"root\" EUID=\"root\" SUID=\"root\" FSUID=\"root\" EGID=\"root\" SGID=\"root\" FSGID=\"root\" type=CWD msg=audit(1792408621.739:1690): cwd=\"/var/spool/cron\" type=PATH msg=audit(1792408621.739:1690): item=0 name=\"/etc/shadow\" inode=16000 dev=103:01 mode=0100640 ouid=0 ogid=42 rdev=00:00 nametype=NORMAL cap_fp=0 cap_fi=0 cap_fe=0 cap_fver=0 cap_frootid=0\u001dOUID=\"root\" OGID=\"shadow\" type=PROCTITLE msg=audit(1792408621.739:1690): proctitle=2F7573722F7362696E2F43524F4E002D66002D50"
