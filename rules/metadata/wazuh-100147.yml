id: wazuh-100147
engine: wazuh
rule_id: 100147
name: Kernel auditing turned off
state: shadow
response: ec2_isolate
mitre: [T1685.004]
wraps: [80705]
references:
  - https://attack.mitre.org/techniques/T1685/004/
  - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1685.004/T1685.004.md
  - https://man7.org/linux/man-pages/man8/auditctl.8.html
  - https://github.com/wazuh/wazuh/blob/v4.14.8/ruleset/rules/0365-auditd_rules.xml
  - https://github.com/systemd/systemd-stable/blob/v249.11/man/journald.conf.xml
tactic: Defense Impairment   # ATT&CK v20 kill_chain_phases of T1685.004
owner: nguyen-doan-hong-huy
created: 2026-10-30
data_source: Linux audit CONFIG_CHANGE record via the official Wazuh rule 80705
description: >
  The kernel audit subsystem was switched off (CONFIG_CHANGE op=set audit_enabled=0): from then on the host produces
  no execve, /etc/shadow-read or who-data record. Observed attack: `auditctl -e 0` (Atomic T1685.004 #2,
  run-202610300307-host-audit-disable-aad1), recorded by Wazuh only as 80705 "Configuration changed" at level 3.
  Every audit_enabled=0 record of the lab history (2026-10-17..30, all archives) was a real loss of telemetry: two
  systemd-journald restarts during unattended upgrades (targets, 2026-10-20, fixed by PR #52), two diagnosis steps
  of that incident, and the Atomic run.
expected_fp: >
  systemd-journald with Ubuntu's default Audit=no turns auditing off whenever it restarts (2026-10-20, both targets).
  The lab hosts now carry Audit=yes (PR #52); an alert from journald still means the host lost its audit telemetry.
  Not measured on benign runs yet.
tests:
  - name: "auditctl -e 0, Atomic T1685.004 #2 on the lab (alert 1793329635.12241060, 2026-10-30T03:07:15Z)"
    expect: match
    log_format: audit
    location: /var/log/audit/audit.log
    log: "type=CONFIG_CHANGE msg=audit(1793329635.424:3556): op=set audit_enabled=0 old=1 auid=4294967295 ses=4294967295 subj=snap.amazon-ssm-agent.amazon-ssm-agent res=1\x1dAUID=\"unset\" type=SYSCALL msg=audit(1793329635.424:3556): arch=c000003e syscall=44 success=yes exit=60 a0=3 a1=7fffe3f11ff0 a2=3c a3=0 items=0 ppid=3473 pid=3474 auid=4294967295 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"auditctl\" exe=\"/usr/sbin/auditctl\" subj=snap.amazon-ssm-agent.amazon-ssm-agent key=(null)\x1dARCH=x86_64 SYSCALL=sendto AUID=\"unset\" UID=\"root\" GID=\"root\" EUID=\"root\" SUID=\"root\" FSUID=\"root\" EGID=\"root\" SGID=\"root\" FSGID=\"root\" type=SOCKADDR msg=audit(1793329635.424:3556): saddr=100000000000000000000000\x1dSADDR={ saddr_fam=netlink nlnk-fam=16 nlnk-pid=0 } type=PROCTITLE msg=audit(1793329635.424:3556): proctitle=617564697463746C002D650030"
  - name: systemd-journald turning auditing off during an unattended upgrade (target-1) (alert 1792480281.24775973, 2026-10-20T07:11:21Z)
    expect: match
    log_format: audit
    location: /var/log/audit/audit.log
    log: "type=CONFIG_CHANGE msg=audit(1792480279.063:4069): op=set audit_enabled=0 old=1 auid=4294967295 ses=4294967295 subj=unconfined res=1\x1dAUID=\"unset\" type=SYSCALL msg=audit(1792480279.063:4069): arch=c000003e syscall=46 success=yes exit=60 a0=6 a1=7ffc1b5895b0 a2=4000 a3=7ffc1b58964c items=0 ppid=1 pid=4111 auid=4294967295 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"systemd-journal\" exe=\"/usr/lib/systemd/systemd-journald\" subj=unconfined key=(null)\x1dARCH=x86_64 SYSCALL=sendmsg AUID=\"unset\" UID=\"root\" GID=\"root\" EUID=\"root\" SUID=\"root\" FSUID=\"root\" EGID=\"root\" SGID=\"root\" FSGID=\"root\" type=SOCKADDR msg=audit(1792480279.063:4069): saddr=100000000000000000000000\x1dSADDR={ saddr_fam=netlink nlnk-fam=16 nlnk-pid=0 } type=PROCTITLE msg=audit(1792480279.063:4069): proctitle=\"/lib/systemd/systemd-journald\""
  - name: auditctl -e 1 turning it back on (same run's cleanup) (alert 1793329647.12255839, 2026-10-30T03:07:27Z)
    expect: no_match
    log_format: audit
    location: /var/log/audit/audit.log
    log: "type=CONFIG_CHANGE msg=audit(1793329645.696:3562): op=set audit_enabled=1 old=1 auid=4294967295 ses=4294967295 subj=snap.amazon-ssm-agent.amazon-ssm-agent res=1\x1dAUID=\"unset\" type=SYSCALL msg=audit(1793329645.696:3562): arch=c000003e syscall=44 success=yes exit=60 a0=3 a1=7ffda6849630 a2=3c a3=0 items=0 ppid=3510 pid=3511 auid=4294967295 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=(none) ses=4294967295 comm=\"auditctl\" exe=\"/usr/sbin/auditctl\" subj=snap.amazon-ssm-agent.amazon-ssm-agent key=(null)\x1dARCH=x86_64 SYSCALL=sendto AUID=\"unset\" UID=\"root\" GID=\"root\" EUID=\"root\" SUID=\"root\" FSUID=\"root\" EGID=\"root\" SGID=\"root\" FSGID=\"root\" type=SOCKADDR msg=audit(1793329645.696:3562): saddr=100000000000000000000000\x1dSADDR={ saddr_fam=netlink nlnk-fam=16 nlnk-pid=0 } type=PROCTITLE msg=audit(1793329645.696:3562): proctitle=617564697463746C002D650031"
  - name: "audit rule removed by auditctl -D (T1685.004 #1 run, not this rule) (alert 1793329793.12352873, 2026-10-30T03:09:53Z)"
    expect: no_match
    log_format: audit
    location: /var/log/audit/audit.log
