references:
  - https://attack.mitre.org/techniques/T1548/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1548.001/T1548.001.md
