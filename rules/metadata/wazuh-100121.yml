id: wazuh-100121
engine: wazuh
rule_id: 100121
name: SSH brute force (non-existent accounts)
state: shadow
response: none
mitre: [T1110]
wraps: [5712]
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://github.com/wazuh/wazuh/blob/v4.14.8/ruleset/rules/0095-sshd_rules.xml
  - https://documentation.wazuh.com/current/user-manual/ruleset/ruleset-xml-syntax/rules.html
tactic: Credential Access
owner: nguyen-doan-hong-huy
created: 2026-10-14
data_source: sshd authentication log via Wazuh agent (official sshd decoder)
description: >
  Official rule 5712: eight attempts with a non-existent user from one source within 120 s. The counting logic (frequency/timeframe/ignore) is the official one; it is not re-implemented here.
expected_fp: Misconfigured automation retrying with an old credential; vulnerability scanners run by the owner.
tests:
  # Wazuh counts by arrival time, so "too slow" cannot be replayed through logtest. The thresholds come from the official rule.
  - name: eight events from one source (official 5712 threshold)
    expect: match
    logs:
      - "Oct  7 10:00:00 ip-10-0-0-5 sshd[20]: Invalid user admin from 10.0.1.99 port 4000"
      - "Oct  7 10:00:02 ip-10-0-0-5 sshd[21]: Invalid user admin from 10.0.1.99 port 4001"
      - "Oct  7 10:00:04 ip-10-0-0-5 sshd[22]: Invalid user admin from 10.0.1.99 port 4002"
      - "Oct  7 10:00:06 ip-10-0-0-5 sshd[23]: Invalid user admin from 10.0.1.99 port 4003"
      - "Oct  7 10:00:08 ip-10-0-0-5 sshd[24]: Invalid user admin from 10.0.1.99 port 4004"
      - "Oct  7 10:00:10 ip-10-0-0-5 sshd[25]: Invalid user admin from 10.0.1.99 port 4005"
      - "Oct  7 10:00:12 ip-10-0-0-5 sshd[26]: Invalid user admin from 10.0.1.99 port 4006"
      - "Oct  7 10:00:14 ip-10-0-0-5 sshd[27]: Invalid user admin from 10.0.1.99 port 4007"
  - name: only three events
    expect: no_match
    logs:
      - "Oct  7 10:00:00 ip-10-0-0-5 sshd[20]: Invalid user admin from 10.0.1.99 port 4000"
      - "Oct  7 10:00:02 ip-10-0-0-5 sshd[21]: Invalid user admin from 10.0.1.99 port 4001"
      - "Oct  7 10:00:04 ip-10-0-0-5 sshd[22]: Invalid user admin from 10.0.1.99 port 4002"
  - name: eight events but from eight different sources
    expect: no_match
    logs:
      - "Oct  7 10:00:00 ip-10-0-0-5 sshd[20]: Invalid user admin from 10.0.1.1 port 4000"
      - "Oct  7 10:00:02 ip-10-0-0-5 sshd[21]: Invalid user admin from 10.0.1.2 port 4001"
      - "Oct  7 10:00:04 ip-10-0-0-5 sshd[22]: Invalid user admin from 10.0.1.3 port 4002"
      - "Oct  7 10:00:06 ip-10-0-0-5 sshd[23]: Invalid user admin from 10.0.1.4 port 4003"
      - "Oct  7 10:00:08 ip-10-0-0-5 sshd[24]: Invalid user admin from 10.0.1.5 port 4004"
      - "Oct  7 10:00:10 ip-10-0-0-5 sshd[25]: Invalid user admin from 10.0.1.6 port 4005"
      - "Oct  7 10:00:12 ip-10-0-0-5 sshd[26]: Invalid user admin from 10.0.1.7 port 4006"
      - "Oct  7 10:00:14 ip-10-0-0-5 sshd[27]: Invalid user admin from 10.0.1.8 port 4007"
  - name: the other brute-force family does not trigger this rule
    expect: no_match
    logs:
      - "Oct  7 10:00:00 ip-10-0-0-5 sshd[20]: Failed password for root from 10.0.1.99 port 4000 ssh2"
      - "Oct  7 10:00:02 ip-10-0-0-5 sshd[21]: Failed password for root from 10.0.1.99 port 4001 ssh2"
      - "Oct  7 10:00:04 ip-10-0-0-5 sshd[22]: Failed password for root from 10.0.1.99 port 4002 ssh2"
      - "Oct  7 10:00:06 ip-10-0-0-5 sshd[23]: Failed password for root from 10.0.1.99 port 4003 ssh2"
      - "Oct  7 10:00:08 ip-10-0-0-5 sshd[24]: Failed password for root from 10.0.1.99 port 4004 ssh2"
      - "Oct  7 10:00:10 ip-10-0-0-5 sshd[25]: Failed password for root from 10.0.1.99 port 4005 ssh2"
      - "Oct  7 10:00:12 ip-10-0-0-5 sshd[26]: Failed password for root from 10.0.1.99 port 4006 ssh2"
      - "Oct  7 10:00:14 ip-10-0-0-5 sshd[27]: Failed password for root from 10.0.1.99 port 4007 ssh2"
