description: >
  HTTP request whose User-Agent is the fake Opera string used by the Sality malware family. Atomic Red Team's
  "Malicious User Agents - Nix" test sends it, so the detection is exercised by a public procedure, not by our own traffic.
expected_fp: Very old Opera 8.x browsers (released 2005-2006).
tests:
  - name: user agents of the Atomic Red Team procedure
    expect: match
    pcap: t1071_001_malicious_user_agents.pcap
  - name: ordinary HTTP clients
    expect: no_match
    pcap: benign_http_clients.pcap
  - name: port scan only
    expect: no_match
    pcap: t1046_nmap_syn_scan.pcap
