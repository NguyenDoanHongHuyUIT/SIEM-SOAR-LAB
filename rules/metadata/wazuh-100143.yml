name: Shell history file deleted or emptied
state: shadow
response: ec2_isolate
mitre: [T1070.003]
wraps: [80792]
references:
  - https://attack.mitre.org/techniques/T1070/003/
  - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1070.003/T1070.003.md
  - https://documentation.wazuh.com/current/user-manual/capabilities/system-calls-monitoring/use-cases/monitoring-commands-run-as-root.html
