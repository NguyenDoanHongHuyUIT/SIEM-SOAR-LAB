tactic: Stealth   # ATT&CK v20 kill_chain_phases of T1070.003
owner: nguyen-doan-hong-huy
created: 2026-10-20
data_source: Linux audit (execve by euid 0, agent/siemsoar.rules) via Wazuh rule 80792
description: >
  rm, truncate, shred or unlink run as root with a *_history file as argument. Observed on the lab: rm
  /root/.bash_history (Atomic T1070.003 #1) and truncate -s0 /root/.bash_history (#5). Variants that empty the
  file through a shell redirection (#2, #3) start no such command and are not seen by this rule.
expected_fp: >
  An administrator clearing their own history on purpose (not measured). Log housekeeping with the same commands
  (truncate -s0 and rm -f of log files, run-202610200640-host-benign-file-housekeeping-edfb, rule as in c1ba4eb)
  did not raise it.
