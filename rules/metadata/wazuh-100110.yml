id: wazuh-100110
engine: wazuh
rule_id: 100110
name: New local user account
state: active
response: ec2_isolate
mitre: [T1136.001]
wraps: [5902]   # official Wazuh rules this rule hangs under (checked by lint)
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://github.com/redcanaryco/atomic-red-team/tree/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1136.001
tactic: Persistence
owner: nguyen-doan-hong-huy
created: 2026-10-06
data_source: auth.log / syslog (adduser, useradd) via Wazuh agent
description: A local account was created on the lab host (persistence technique).
expected_fp: >
  Planned provisioning of interactive users. Service accounts without a login shell go to the exception 100112
  (measured FP of the benign service-account scenario on the lab).
tests:
  - name: useradd syslog line (full decoder -> 5902 -> 100110 chain)
    expect: match
    log: "Oct  7 10:00:00 ip-10-0-0-5 useradd[1234]: new user: name=backdoor, UID=1001, GID=1001, home=/home/backdoor, shell=/bin/bash, from=/dev/pts/0"
  - name: Atomic T1136.001 #1 account recorded on the lab (real useradd line)
    expect: match
    log: "Oct 19 01:29:35 ip-10-42-0-73 useradd[1622]: new user: name=siemsoar_sim_ab03, UID=997, GID=100, home=/home/siemsoar_sim_ab03, shell=/bin/bash, from=none"
  - name: Atomic T1136.001 #6 root-group account recorded on the lab (real useradd line)
    expect: match
    log: "Oct 19 03:19:46 ip-10-42-0-73 useradd[2796]: new user: name=siemsoar_r_3d44, UID=1002, GID=0, home=/root, shell=/bin/bash, from=none"
  - name: service account without a login shell goes to the exception 100112 (real useradd line)
    expect: no_match
    log: "Oct 19 03:13:32 ip-10-42-0-73 useradd[2653]: new user: name=siemsoar_svc_1565, UID=997, GID=997, home=/home/siemsoar_svc_1565, shell=/usr/sbin/nologin, from=none"
  - name: groupadd must not fire the user rule
    expect: no_match
    log: "Oct  7 10:00:00 ip-10-0-0-5 groupadd[1234]: new group: name=ops, GID=1001"
