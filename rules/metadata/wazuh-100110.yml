id: wazuh-100110
engine: wazuh
rule_id: 100110
name: New local user account
state: shadow
response: ec2_isolate
mitre: [T1136.001]
wraps: [5902]   # official Wazuh rules this rule hangs under (checked by lint)
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://github.com/redcanaryco/atomic-red-team/tree/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1136.001
tactic: Persistence
owner: nguyen-doan-hong-huy
created: 2026-10-06
data_source: auth.log / syslog (adduser, useradd) via Wazuh agent
description: A local account was created on the lab host (persistence technique).
expected_fp: Planned provisioning of lab users.
tests:
  - name: useradd syslog line (full decoder -> 5902 -> 100110 chain)
    expect: match
    log: "Oct  7 10:00:00 ip-10-0-0-5 useradd[1234]: new user: name=backdoor, UID=1001, GID=1001, home=/home/backdoor, shell=/bin/bash, from=/dev/pts/0"
  - name: groupadd must not fire the user rule
    expect: no_match
    log: "Oct  7 10:00:00 ip-10-0-0-5 groupadd[1234]: new group: name=ops, GID=1001"
