id: suricata-2009582
engine: suricata
source: et-open          # rule text: rules/reference/et-open-managed.json (pinned ET Open release)
rule_id: 2009582
wazuh_rule_id: 110101    # Wazuh rule generated by `rulesctl build` that carries state/response for this sid
level: 8
name: Nmap TCP SYN scan (ET SCAN NMAP -sS window 1024)
state: shadow
response: none
mitre: [T1046]           # evidence: Atomic Red Team T1046 test 2 (rules/pcaps/provenance.json, scenario net-portscan)
references:
  - https://attack.mitre.org/techniques/T1046/
  - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1046/T1046.md
  - https://rules.emergingthreats.net/open/suricata-7.0.3/rules/emerging-scan.rules
tactic: Discovery
owner: nguyen-doan-hong-huy
created: 2026-10-15
data_source: Suricata EVE JSON via Wazuh agent
description: >
  SYN packets with nmap's default raw-socket window size. Emerging Threats ships this rule disabled; SIEMSOAR enables
  it (the pinned text is deployed and suricata-update is told to drop its own copy) and keeps it in shadow until the
  false-positive rate measured by the benign scenarios is known.
expected_fp: Authorised vulnerability scanners and asset inventory tools that use nmap SYN scans.
tests:
  - name: nmap -sS from the Atomic Red Team procedure
    expect: match
    pcap: t1046_nmap_syn_scan.pcap
  - name: ordinary HTTP clients
    expect: no_match
    pcap: benign_http_clients.pcap
  - name: HTTP beacons with odd user agents (no scan)
    expect: no_match
    pcap: t1071_001_malicious_user_agents.pcap
