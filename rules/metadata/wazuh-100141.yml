data_source: Wazuh syscheck (FIM) on /etc/systemd/system
description: >
  A unit file under /etc/systemd/system was added or changed. Observed on the lab: FIM 554 on
  /etc/systemd/system/art-systemd-service.service (Atomic T1543.002 #1).
expected_fp: >
  Administrators adding or overriding services; packages writing drop-ins there.
tests:
  - name: unit added (Atomic T1543.002 #1 on the lab)
    expect: match
    fim: {path: /etc/systemd/system/art-systemd-service.service, type: added}
  - name: a unit shipped by a package (not under /etc)
    expect: no_match
    fim: {path: /usr/lib/systemd/system/cron.service, type: modified}
