id: wazuh-100100
engine: wazuh
rule_id: 100100
name: Critical account file modified
state: active
response: ec2_isolate
mitre: [T1136.001]
wraps: [550]   # official Wazuh rules this rule hangs under (checked by lint)
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html
tactic: Persistence
owner: nguyen-doan-hong-huy
created: 2026-10-06
data_source: Wazuh syscheck (FIM) on the lab EC2
description: >
  /etc/passwd changed. In a lab host this should only happen through the package manager or an admin
  adding a user; the response is host containment after human approval.
expected_fp: Legitimate maintenance (useradd by an administrator, package post-install scripts).
tests:
  # FIM events go through the analysisd queue (syscheck never reaches logtest): tools/wazuh_logtest.py --container
  - name: passwd content changed
    expect: match
    fim: {path: /etc/passwd}
  - name: other file changed
    expect: no_match
    fim: {path: /etc/hosts}
  - name: passwd prefix lookalike
    expect: no_match
    fim: {path: /etc/passwd-}
  - name: not an integrity event (sshd line that only mentions the file)
    expect: no_match
    log: "Oct  7 10:00:00 ip-10-0-0-5 sshd[20]: error: could not open /etc/passwd for reading"
