[project]
name = "siem-soar-lab"
version = "0.1.0"
description = "SIEM/SOAR lab on AWS: Wazuh + GuardDuty + Suricata with detection-as-code"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src/lambdas", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S105", "S106", "S107", "S101", "S311", "S603", "S607", "S310", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
